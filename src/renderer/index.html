<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: mdview:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDON MDView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="edon-mark" viewBox="0 0 256 256"><path d="M8 53h150v30H38v90h120v30H8z"/><path d="M75 113h173v30H75z"/><path class="edon-md" fill-rule="evenodd" d="M172 203v-42h12l7 19 7-19h12v42h-10v-25l-7 19h-4l-7-19v25zM217 161h14a17 21 0 0 1 0 42h-14zM227 171v22h4a7 11 0 0 0 0-22z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2h7A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 15.3A8.7 8.7 0 0 1 8.7 3.5 8.8 8.8 0 1 0 20.5 15.3Z"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-3"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 7.5 3 3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-save-as" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></symbol>
    <symbol id="i-code-block" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9-3 3 3 3m4-6 3 3-3 3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></symbol>
    <symbol id="i-list-ordered" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 5.2 5.5 4v5M4 9h3M4 15.3c.4-1.4 3-1.4 3 .1 0 1.3-3 2-3 3.6h3"/></symbol>
    <symbol id="i-list-task" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.2"/><path d="m3.5 16.8 1.8 1.8 3.4-3.8M13 7h8M13 17h8"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M10 8h10M10 12h10M10 16h6"/></symbol>
    <symbol id="i-rule" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 6h10M7 18h10" opacity=".45"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
    <symbol id="i-row-above" viewBox="0 0 24 24"><rect x="3" y="12" width="18" height="8" rx="1.5"/><path d="M12 3v6m-3-3h6"/></symbol>
    <symbol id="i-row-below" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="8" rx="1.5"/><path d="M12 15v6m-3-3h6"/></symbol>
    <symbol id="i-row-delete" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="m10 10 4 4m0-4-4 4"/></symbol>
    <symbol id="i-column-left" viewBox="0 0 24 24"><rect x="12" y="3" width="8" height="18" rx="1.5"/><path d="M3 12h6M6 9v6"/></symbol>
    <symbol id="i-column-right" viewBox="0 0 24 24"><rect x="4" y="3" width="8" height="18" rx="1.5"/><path d="M15 12h6m-3-3v6"/></symbol>
    <symbol id="i-column-delete" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1.5"/><path d="m10 10 4 4m0-4-4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  </svg>

  <div id="app">
    <header class="topbar">
      <div class="toolbar-group">
        <button id="open-button" class="button primary" data-i18n-title="top.open.title">
          <svg class="icon"><use href="#i-folder"/></svg><span data-i18n="top.open"></span>
        </button>
        <button id="sidebar-button" class="icon-button active" data-i18n-title="top.sidebar.title" data-i18n-label="top.sidebar.label" aria-pressed="true">
          <svg class="icon"><use href="#i-panel"/></svg>
        </button>
      </div>
      <div id="document-heading" class="document-heading">
        <svg class="icon"><use href="#i-file"/></svg>
        <span id="document-name"></span>
        <span id="dirty-indicator" class="dirty-indicator" hidden data-i18n-title="top.dirty" data-i18n-label="top.dirty"></span>
      </div>
      <div class="toolbar-actions">
        <button id="edit-button" class="button" data-i18n-title="top.edit.title" aria-pressed="false" disabled>
          <svg class="icon"><use href="#i-edit"/></svg><span data-i18n="top.edit"></span>
        </button>
        <button id="save-button" class="button primary" data-i18n-title="top.save.title" hidden disabled>
          <svg class="icon"><use href="#i-save"/></svg><span data-i18n="top.save"></span>
        </button>
        <span class="toolbar-separator"></span>
        <button id="search-button" class="icon-button" data-i18n-title="top.search.title" data-i18n-label="top.search.label">
          <svg class="icon"><use href="#i-search"/></svg>
        </button>
        <button id="theme-button" class="icon-button" data-i18n-title="top.theme.title" data-i18n-label="top.theme.label">
          <svg class="icon theme-sun"><use href="#i-sun"/></svg>
          <svg class="icon theme-moon"><use href="#i-moon"/></svg>
        </button>
        <span class="toolbar-separator"></span>
        <button id="export-button" class="icon-button" data-i18n-title="top.export.title" data-i18n-label="top.export.label" disabled>
          <svg class="icon"><use href="#i-export"/></svg>
        </button>
        <button id="print-button" class="icon-button" data-i18n-title="top.print.title" data-i18n-label="top.print.label" disabled>
          <svg class="icon"><use href="#i-print"/></svg>
        </button>
      </div>
    </header>

    <section id="search-panel" class="search-panel" hidden data-i18n-label="search.panel">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="search-input" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false" data-i18n-label="search.input">
      <span id="search-count" class="search-count"></span>
      <button id="search-previous" class="icon-button small" data-i18n-title="search.previous.title" data-i18n-label="search.previous"><svg class="icon"><use href="#i-up"/></svg></button>
      <button id="search-next" class="icon-button small" data-i18n-title="search.next.title" data-i18n-label="search.next"><svg class="icon"><use href="#i-down"/></svg></button>
      <button id="search-close" class="icon-button small" data-i18n-title="search.close.title" data-i18n-label="search.close"><svg class="icon"><use href="#i-close"/></svg></button>
    </section>

    <section id="edit-toolbar" class="edit-toolbar" hidden role="toolbar" data-i18n-label="toolbar.label">
      <button class="tool-button" data-command="undo" data-i18n-title="toolbar.undo.title" data-i18n-label="toolbar.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="tool-button" data-command="redo" data-i18n-title="toolbar.redo.title" data-i18n-label="toolbar.redo"><svg class="icon"><use href="#i-redo"/></svg></button>
      <span class="toolbar-separator"></span>
      <select id="block-type" class="tool-select" data-i18n-title="toolbar.blockType.title" data-i18n-label="toolbar.blockType">
        <option value="paragraph" data-i18n="toolbar.paragraph"></option>
        <option value="1" data-i18n="toolbar.heading" data-i18n-params='{"level":1}'></option>
        <option value="2" data-i18n="toolbar.heading" data-i18n-params='{"level":2}'></option>
        <option value="3" data-i18n="toolbar.heading" data-i18n-params='{"level":3}'></option>
        <option value="4" data-i18n="toolbar.heading" data-i18n-params='{"level":4}'></option>
        <option value="5" data-i18n="toolbar.heading" data-i18n-params='{"level":5}'></option>
        <option value="6" data-i18n="toolbar.heading" data-i18n-params='{"level":6}'></option>
      </select>
      <span class="toolbar-separator"></span>
      <button class="tool-button glyph" data-command="bold" data-active="bold" data-i18n-title="toolbar.bold.title" data-i18n-label="toolbar.bold" aria-pressed="false"><b data-i18n="toolbar.bold.glyph"></b></button>
      <button class="tool-button glyph" data-command="italic" data-active="italic" data-i18n-title="toolbar.italic.title" data-i18n-label="toolbar.italic" aria-pressed="false"><i data-i18n="toolbar.italic.glyph"></i></button>
      <button class="tool-button glyph" data-command="strike" data-active="strike" data-i18n-title="toolbar.strike.title" data-i18n-label="toolbar.strike" aria-pressed="false"><s data-i18n="toolbar.strike.glyph"></s></button>
      <button class="tool-button" data-command="code" data-active="code" data-i18n-title="toolbar.code.title" data-i18n-label="toolbar.code" aria-pressed="false"><svg class="icon"><use href="#i-code"/></svg></button>
      <span class="toolbar-separator"></span>
      <button class="tool-button" data-command="bulletList" data-active="bulletList" data-i18n-title="toolbar.bulletList.title" data-i18n-label="toolbar.bulletList" aria-pressed="false"><svg class="icon"><use href="#i-list"/></svg></button>
      <button class="tool-button" data-command="orderedList" data-active="orderedList" data-i18n-title="toolbar.orderedList.title" data-i18n-label="toolbar.orderedList" aria-pressed="false"><svg class="icon"><use href="#i-list-ordered"/></svg></button>
      <button class="tool-button" data-command="taskList" data-active="taskList" data-i18n-title="toolbar.taskList.title" data-i18n-label="toolbar.taskList" aria-pressed="false"><svg class="icon"><use href="#i-list-task"/></svg></button>
      <span class="toolbar-separator"></span>
      <button class="tool-button" data-command="blockquote" data-active="blockquote" data-i18n-title="toolbar.blockquote.title" data-i18n-label="toolbar.blockquote" aria-pressed="false"><svg class="icon"><use href="#i-quote"/></svg></button>
      <button class="tool-button" data-command="codeBlock" data-active="codeBlock" data-i18n-title="toolbar.codeBlock.title" data-i18n-label="toolbar.codeBlock" aria-pressed="false"><svg class="icon"><use href="#i-code-block"/></svg></button>
      <button class="tool-button" data-command="horizontalRule" data-i18n-title="toolbar.rule" data-i18n-label="toolbar.rule"><svg class="icon"><use href="#i-rule"/></svg></button>
      <span class="toolbar-separator"></span>
      <button class="tool-button" data-command="link" data-active="link" data-i18n-title="toolbar.link.title" data-i18n-label="toolbar.link" aria-pressed="false"><svg class="icon"><use href="#i-link"/></svg></button>
      <button class="tool-button" data-command="image" data-i18n-title="toolbar.image" data-i18n-label="toolbar.image"><svg class="icon"><use href="#i-image"/></svg></button>
      <button class="tool-button" data-command="table" data-i18n-title="toolbar.table" data-i18n-label="toolbar.table"><svg class="icon"><use href="#i-table"/></svg></button>
      <span id="table-tools" class="tool-group" hidden role="group" data-i18n-label="toolbar.tableTools">
        <span class="toolbar-separator"></span>
        <button class="tool-button" data-command="rowBefore" data-i18n-title="toolbar.rowBefore" data-i18n-label="toolbar.rowBefore"><svg class="icon"><use href="#i-row-above"/></svg></button>
        <button class="tool-button" data-command="rowAfter" data-i18n-title="toolbar.rowAfter" data-i18n-label="toolbar.rowAfter"><svg class="icon"><use href="#i-row-below"/></svg></button>
        <button class="tool-button" data-command="rowDelete" data-i18n-title="toolbar.rowDelete" data-i18n-label="toolbar.rowDelete"><svg class="icon"><use href="#i-row-delete"/></svg></button>
        <button class="tool-button" data-command="columnBefore" data-i18n-title="toolbar.columnBefore" data-i18n-label="toolbar.columnBefore"><svg class="icon"><use href="#i-column-left"/></svg></button>
        <button class="tool-button" data-command="columnAfter" data-i18n-title="toolbar.columnAfter" data-i18n-label="toolbar.columnAfter"><svg class="icon"><use href="#i-column-right"/></svg></button>
        <button class="tool-button" data-command="columnDelete" data-i18n-title="toolbar.columnDelete" data-i18n-label="toolbar.columnDelete"><svg class="icon"><use href="#i-column-delete"/></svg></button>
        <button class="tool-button danger" data-command="tableDelete" data-i18n-title="toolbar.tableDelete" data-i18n-label="toolbar.tableDelete"><svg class="icon"><use href="#i-trash"/></svg></button>
      </span>
      <span class="status-spacer"></span>
      <button id="save-as-button" class="tool-button" data-i18n-title="toolbar.saveAs.title" data-i18n-label="toolbar.saveAs"><svg class="icon"><use href="#i-save-as"/></svg></button>
    </section>

    <section id="conflict-banner" class="conflict-banner" hidden role="alert">
      <span class="conflict-text"><strong data-i18n="conflict.title"></strong> <span data-i18n="conflict.detail"></span></span>
      <button id="conflict-reload" class="button" data-i18n="conflict.reload"></button>
      <button id="conflict-keep" class="button primary" data-i18n="conflict.keep"></button>
    </section>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-heading"><span data-i18n="sidebar.heading"></span><span id="heading-count" class="heading-count">0</span></div>
        <nav id="toc" class="toc" data-i18n-label="toc.label"></nav>
        <div class="sidebar-footer">
          <svg class="icon"><use href="#i-check"/></svg>
          <span data-i18n="sidebar.autoRefresh"></span>
        </div>
      </aside>

      <main id="viewer" class="viewer" tabindex="-1">
        <div id="scroll-progress" class="scroll-progress"></div>
        <article id="content" class="markdown-body welcome">
          <div class="welcome-hero">
            <span class="welcome-logo"><svg aria-hidden="true" class="edon-logo" viewBox="0 0 256 256"><use href="#edon-mark"/></svg></span>
            <p class="eyebrow" data-i18n="welcome.eyebrow"></p>
            <h1 data-i18n="welcome.title"></h1>
            <p class="welcome-lead" data-i18n="welcome.lead"></p>
            <button id="welcome-open" class="button primary large"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="welcome.open"></span></button>
            <p class="welcome-hint" data-i18n="welcome.hint"></p>
          </div>
          <div class="feature-grid">
            <div><strong data-i18n="welcome.feature.outline.title"></strong><span data-i18n="welcome.feature.outline.text"></span></div>
            <div><strong data-i18n="welcome.feature.editor.title"></strong><span data-i18n="welcome.feature.editor.text"></span></div>
            <div><strong data-i18n="welcome.feature.share.title"></strong><span data-i18n="welcome.feature.share.text"></span></div>
          </div>
          <div class="welcome-shortcuts"><span><kbd>Ctrl</kbd><kbd>O</kbd> <span data-i18n="welcome.shortcut.open"></span></span><span><kbd>Ctrl</kbd><kbd>E</kbd> <span data-i18n="welcome.shortcut.edit"></span></span><span><kbd>Ctrl</kbd><kbd>F</kbd> <span data-i18n="welcome.shortcut.search"></span></span><span><kbd>Ctrl</kbd><kbd>\</kbd> <span data-i18n="welcome.shortcut.outline"></span></span></div>
        </article>
        <div id="editor" class="editor-host" hidden></div>
      </main>
    </div>

    <footer class="statusbar">
      <span class="live-status"><span class="status-dot"></span><span id="status-text"></span></span>
      <span id="status-path" class="status-path"></span>
      <span class="status-spacer"></span>
      <span id="word-count"></span>
      <span class="status-divider"></span>
      <span id="reading-time"></span>
      <span class="status-divider"></span>
      <button id="shortcuts-button" class="status-button" data-i18n-title="status.shortcuts" data-i18n-label="status.shortcuts"><svg class="icon"><use href="#i-keyboard"/></svg></button>
      <span id="zoom-level">100%</span>
    </footer>
  </div>

  <div id="drag-overlay" class="drag-overlay" hidden><div><svg class="icon"><use href="#i-file"/></svg><strong data-i18n="drag.title"></strong><span data-i18n="drag.subtitle"></span></div></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <dialog id="shortcuts-dialog" class="shortcuts-dialog">
    <div class="dialog-heading"><h2 data-i18n="shortcuts.title"></h2><button id="shortcuts-close" class="icon-button" data-i18n-label="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="shortcut-scroll">
      <h3 class="shortcut-section" data-i18n="shortcuts.section.document"></h3>
      <dl class="shortcut-list">
        <div><dt data-i18n="shortcuts.open"></dt><dd><kbd>Ctrl</kbd><kbd>O</kbd></dd></div>
        <div><dt data-i18n="shortcuts.edit"></dt><dd><kbd>Ctrl</kbd><kbd>E</kbd></dd></div>
        <div><dt data-i18n="shortcuts.save"></dt><dd><kbd>Ctrl</kbd><kbd>S</kbd></dd></div>
        <div><dt data-i18n="shortcuts.saveAs"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>S</kbd></dd></div>
        <div><dt data-i18n="shortcuts.search"></dt><dd><kbd>Ctrl</kbd><kbd>F</kbd></dd></div>
        <div><dt data-i18n="shortcuts.reload"></dt><dd><kbd>F5</kbd></dd></div>
        <div><dt data-i18n="shortcuts.sidebar"></dt><dd><kbd>Ctrl</kbd><kbd>\</kbd></dd></div>
        <div><dt data-i18n="shortcuts.theme"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>T</kbd></dd></div>
        <div><dt data-i18n="shortcuts.export"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>E</kbd></dd></div>
        <div><dt data-i18n="shortcuts.print"></dt><dd><kbd>Ctrl</kbd><kbd>P</kbd></dd></div>
        <div><dt data-i18n="shortcuts.zoom"></dt><dd><kbd>Ctrl</kbd><kbd>+</kbd><span>/</span><kbd>−</kbd></dd></div>
      </dl>
      <h3 class="shortcut-section" data-i18n="shortcuts.section.editing"></h3>
      <dl class="shortcut-list">
        <div><dt data-i18n="shortcuts.undoRedo"></dt><dd><kbd>Ctrl</kbd><kbd>Z</kbd><span>/</span><kbd>Ctrl</kbd><kbd>Y</kbd></dd></div>
        <div><dt data-i18n="shortcuts.bold"></dt><dd><kbd>Ctrl</kbd><kbd>B</kbd></dd></div>
        <div><dt data-i18n="shortcuts.italic"></dt><dd><kbd>Ctrl</kbd><kbd>I</kbd></dd></div>
        <div><dt data-i18n="shortcuts.strike"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>X</kbd></dd></div>
        <div><dt data-i18n="shortcuts.code"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>C</kbd></dd></div>
        <div><dt data-i18n="shortcuts.link"></dt><dd><kbd>Ctrl</kbd><kbd>K</kbd></dd></div>
        <div><dt data-i18n="shortcuts.headings"></dt><dd><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>1</kbd><span>…</span><kbd>6</kbd></dd></div>
        <div><dt data-i18n="shortcuts.paragraph"></dt><dd><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>0</kbd></dd></div>
        <div><dt data-i18n="shortcuts.bulletList"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>8</kbd></dd></div>
        <div><dt data-i18n="shortcuts.orderedList"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>7</kbd></dd></div>
        <div><dt data-i18n="shortcuts.taskList"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>9</kbd></dd></div>
        <div><dt data-i18n="shortcuts.blockquote"></dt><dd><kbd>Ctrl</kbd><kbd data-i18n="key.shift"></kbd><kbd>B</kbd></dd></div>
        <div><dt data-i18n="shortcuts.codeBlock"></dt><dd><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>C</kbd></dd></div>
        <div><dt data-i18n="shortcuts.indent"></dt><dd><kbd>Tab</kbd><span>/</span><kbd data-i18n="key.shift"></kbd><kbd>Tab</kbd></dd></div>
        <div><dt data-i18n="shortcuts.lineBreak"></dt><dd><kbd data-i18n="key.shift"></kbd><kbd data-i18n="key.enter"></kbd></dd></div>
      </dl>
    </div>
  </dialog>

  <dialog id="about-dialog" class="shortcuts-dialog about-dialog" aria-labelledby="about-dialog-title">
    <div class="dialog-heading"><h2 id="about-dialog-title" data-i18n="about.title"></h2><button id="about-close" class="icon-button" data-i18n-label="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="about-scroll">
      <div class="about-product">
        <span class="about-logo"><svg aria-hidden="true" class="edon-logo" viewBox="0 0 256 256"><use href="#edon-mark"/></svg></span>
        <div>
          <p id="about-name" class="about-name"></p>
          <p id="about-version" class="about-version"></p>
        </div>
      </div>
      <p class="about-text" data-i18n="about.tagline"></p>
      <p class="about-text" data-i18n="about.privacy"></p>
      <div class="about-developer">
        <strong id="about-developer"></strong>
        <a id="about-website" data-i18n-title="about.website.title"></a>
        <span id="about-license"></span>
      </div>
      <h3 class="shortcut-section" data-i18n="about.credits.title"></h3>
      <p class="about-text" data-i18n="about.credits.intro"></p>
      <ul id="about-credits" class="about-credits" data-i18n-label="about.credits.label"></ul>
    </div>
  </dialog>

  <dialog id="link-dialog" class="shortcuts-dialog form-dialog" aria-labelledby="link-dialog-title">
    <div class="dialog-heading"><h2 id="link-dialog-title" data-i18n="link.title"></h2><button class="icon-button" data-dialog-close data-i18n-label="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <label class="field"><span data-i18n="link.field"></span><input id="link-url" type="text" data-i18n-placeholder="link.placeholder" autocomplete="off" spellcheck="false"></label>
    <div class="dialog-actions">
      <button id="link-remove" class="button" data-i18n="link.remove"></button>
      <span class="status-spacer"></span>
      <button class="button" data-dialog-close data-i18n="dialog.cancel"></button>
      <button id="link-apply" class="button primary" data-i18n="dialog.apply"></button>
    </div>
  </dialog>

  <dialog id="image-dialog" class="shortcuts-dialog form-dialog" aria-labelledby="image-dialog-title">
    <div class="dialog-heading"><h2 id="image-dialog-title" data-i18n="image.title"></h2><button class="icon-button" data-dialog-close data-i18n-label="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <label class="field"><span data-i18n="image.field"></span>
      <span class="field-row"><input id="image-src" type="text" data-i18n-placeholder="image.placeholder" autocomplete="off" spellcheck="false"><button id="image-browse" class="button" data-i18n="image.browse"></button></span>
    </label>
    <label class="field"><span data-i18n="image.alt"></span><input id="image-alt" type="text" data-i18n-placeholder="image.alt.placeholder" autocomplete="off"></label>
    <div class="dialog-actions">
      <span class="status-spacer"></span>
      <button class="button" data-dialog-close data-i18n="dialog.cancel"></button>
      <button id="image-apply" class="button primary"></button>
    </div>
  </dialog>

  <datalist id="code-languages">
    <option value="bash"></option><option value="c"></option><option value="cpp"></option><option value="csharp"></option><option value="css"></option>
    <option value="diff"></option><option value="go"></option><option value="html"></option><option value="java"></option><option value="javascript"></option>
    <option value="json"></option><option value="markdown"></option><option value="php"></option><option value="powershell"></option><option value="python"></option>
    <option value="rust"></option><option value="sql"></option><option value="typescript"></option><option value="xml"></option><option value="yaml"></option>
  </datalist>

  <script src="../../dist/renderer.js"></script>
</body>
</html>
